name: deploy
# Releases a new app version (app config, webhooks, theme extension) when
# main changes what Shopify serves. Needs the repo secret
# SHOPIFY_LV_APP_AUTOMATION_TOKEN (the Live Visitors service account's CLI automation token);
# without it the deploy step is skipped.
on:
  push:
    branches: [main]
    paths:
      - shopify.app.toml
      - extensions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_LV_APP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: shopify app deploy
        if: env.SHOPIFY_APP_AUTOMATION_TOKEN != ''
        run: npx shopify app deploy --allow-updates --message "${GITHUB_SHA::7}"
      - name: no token
        if: env.SHOPIFY_APP_AUTOMATION_TOKEN == ''
        run: echo "::warning::SHOPIFY_LV_APP_AUTOMATION_TOKEN is not set; skipped shopify app deploy."
