name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: storefront asset is built from storefront/live-visitors.js
        run: npm run build:storefront && git diff --exit-code extensions/live-visitors/assets
      - name: waiting-room asset is built from waiting-room/storefront/waiting-room.js
        run: npm run build:waiting-room && git diff --exit-code waiting-room/extensions/waiting-room-embed/assets
      - run: npm test

  storefront-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      # Against the bundled mock server (the Hibira server image is private).
      - run: npx vitest run tests/storefront/e2e.test.mjs

  # Hibira Waiting Room: the checkout rule (a Rust Shopify Function).
  waiting-room-function:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waiting-room/extensions/checkout-pass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --locked
      - run: cargo build --locked --release --target=wasm32-unknown-unknown
